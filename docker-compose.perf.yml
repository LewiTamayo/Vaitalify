# Referencia: el flujo principal usa Neon (ver docs/DECISIONES.md, U-2).
# Imita las restricciones de una función serverless para pruebas JMeter (spec §19.1).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: vitalify
      POSTGRES_PASSWORD: vitalify
      POSTGRES_DB: vitalify_perf
    ports:
      - '5432:5432'
  api:
    build: .
    depends_on:
      - db
    cpus: '1'
    mem_limit: 1g
    environment:
      APP_ENV: perf
      RATE_LIMIT_ENABLED: 'false'
      BCRYPT_COST: '12'
      DATABASE_URL: postgresql://vitalify:vitalify@db:5432/vitalify_perf
      DIRECT_URL: postgresql://vitalify:vitalify@db:5432/vitalify_perf
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?definir en el entorno}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?definir en el entorno}
    ports:
      - '3000:3000'
