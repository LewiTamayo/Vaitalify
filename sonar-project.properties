sonar.organization=lewitamayo
sonar.projectKey=LewiTamayo_Vaitalify
sonar.projectName=Vitalify API
sonar.sourceEncoding=UTF-8

# API (src/) y front de demostración (web/src/)
sonar.sources=src,web/src
sonar.tests=tests,web/src
sonar.exclusions=**/node_modules/**,prisma/migrations/**,**/*.d.ts,src/generated/**,web/src/**/*.test.ts,web/src/**/*.test.tsx,web/src/test/**
sonar.test.inclusions=tests/**/*.ts,web/src/**/*.test.ts,web/src/**/*.test.tsx,web/src/test/**
# Las pruebas de JMeter no son código fuente ni pruebas unitarias
sonar.coverage.exclusions=src/local.ts,src/config/**,src/common/openapi/**,tests/performance/**,web/src/main.tsx

sonar.javascript.lcov.reportPaths=coverage/lcov.info,web/coverage/lcov.info
sonar.testExecutionReportPaths=reports/sonar-report.xml
