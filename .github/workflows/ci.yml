name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vitalify
          POSTGRES_PASSWORD: vitalify
          POSTGRES_DB: vitalify_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vitalify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://vitalify:vitalify@localhost:5432/vitalify_test
      DIRECT_URL: postgresql://vitalify:vitalify@localhost:5432/vitalify_test
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarQube necesita el historial para detectar código nuevo

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Secretos JWT efímeros para los tests
        run: |
          echo "JWT_ACCESS_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "JWT_REFRESH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage

      - name: Front (web/)
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run test:coverage
          npm run build

      - name: Análisis SonarQube Cloud + Quality Gate
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5
        with:
          args: -Dsonar.qualitygate.wait=true
